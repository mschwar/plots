<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology Adoption Speed Over Time</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    color: #e8eaf6;
    font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #f87171, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    color: #6b7280;
    font-size: 0.9rem;
    margin-bottom: 36px;
  }
  #chart-container {
    width: 100%;
    max-width: 1100px;
    position: relative;
  }
  svg { overflow: visible; }
  .grid line {
    stroke: #1e2030;
    stroke-dasharray: 3 4;
  }
  .grid path { stroke: none; }
  .axis text { fill: #6b7280; font-size: 12px; }
  .axis path, .axis line { stroke: #2d3148; }
  .axis-label { fill: #9ca3af; font-size: 13px; font-weight: 500; }
  .dot {
    cursor: pointer;
    transition: r 0.15s, opacity 0.15s;
  }
  .dot:hover { opacity: 1 !important; }
  .dot-speculative {
    stroke-dasharray: 4 3;
    stroke-width: 2;
    fill-opacity: 0.25;
    cursor: pointer;
  }
  .label {
    font-size: 11px;
    fill: #d1d5db;
    pointer-events: none;
    font-weight: 500;
  }
  .label-speculative {
    font-size: 11px;
    fill: #6b7280;
    pointer-events: none;
    font-weight: 500;
  }
  .tooltip {
    position: absolute;
    background: #1c1f2e;
    border: 1px solid #2d3148;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 260px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .tooltip strong { font-size: 14px; display: block; margin-bottom: 4px; }
  .tooltip .days-value { font-size: 18px; font-weight: 700; margin: 4px 0; }
  .tooltip .meta { color: #9ca3af; font-size: 12px; margin-top: 4px; line-height: 1.5; }
  .tooltip .spec-badge {
    display: inline-block;
    background: #2d2040;
    color: #a78bfa;
    border: 1px solid #4c3880;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    margin-top: 4px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    margin-top: 20px;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #9ca3af;
  }
  .legend-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-extras {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .legend-est {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #6b7280;
  }
  .legend-est-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px dashed #6b7280;
    background: rgba(107,114,128,0.2);
    flex-shrink: 0;
  }
  .era-label {
    fill: #374151;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .trend-line {
    fill: none;
    stroke: #a78bfa;
    stroke-width: 1.5;
    stroke-dasharray: 6 4;
    opacity: 0.3;
  }
</style>
</head>
<body>
<h1>Technology Adoption Speed Over Time</h1>
<p class="subtitle">Days to reach 50M users &nbsp;·&nbsp; 1957–2026 &nbsp;·&nbsp; Log scale &nbsp;·&nbsp; Dashed = speculative</p>
<div id="chart-container">
  <div class="tooltip" id="tooltip"></div>
</div>
<div class="legend" id="legend"></div>
<div class="legend-extras">
  <div class="legend-est">
    <div class="legend-est-dot"></div>
    Speculative / projected
  </div>
  <div class="legend-est">
    <div style="width:24px;height:2px;border-top:2px dashed #a78bfa;opacity:0.5;margin-top:1px;flex-shrink:0"></div>
    Exponential decay trend
  </div>
</div>

<script>
const catColors = {
  "Hardware":             "#60a5fa",
  "Software/Compiler":    "#f59e0b",
  "Internet/Web":         "#34d399",
  "Mobile":               "#a78bfa",
  "Social/Apps":          "#f472b6",
  "Cloud/Infrastructure": "#94a3b8",
  "AI/Agentic":           "#f87171",
};

// year, event, category, days, impact, speculative, labelKey, displayYearOffset
const data = [
  { year: 1957, event: "FORTRAN Compiler (IBM)",                    category: "Software/Compiler",    days: 3650, impact: "High",          speculative: false, labelKey: null },
  { year: 1969, event: "ARPANET launch",                            category: "Internet/Web",         days: 3650, impact: "High",          speculative: false, labelKey: "ARPANET" },
  { year: 1971, event: "Intel 4004 Microprocessor",                category: "Hardware",             days: 1825, impact: "Medium",        speculative: false, labelKey: null },
  { year: 1975, event: "Microsoft BASIC / Altair 8800",            category: "Software/Compiler",    days: 1825, impact: "Medium",        speculative: false, labelKey: null },
  { year: 1981, event: "IBM PC release",                            category: "Hardware",             days: 1460, impact: "High",          speculative: false, labelKey: null },
  { year: 1984, event: "Apple Macintosh (GUI)",                    category: "Hardware",             days: 1825, impact: "High",          speculative: false, labelKey: null },
  { year: 1989, event: "World Wide Web (Berners-Lee)",             category: "Internet/Web",         days: 1460, impact: "Transformative", speculative: false, labelKey: "WWW" },
  { year: 1995, event: "Windows 95 + Netscape boom",               category: "Internet/Web",         days: 730,  impact: "High",          speculative: false, labelKey: null },
  { year: 1998, event: "Google Search public",                     category: "Internet/Web",         days: 1095, impact: "High",          speculative: false, labelKey: null },
  { year: 2004, event: "Facebook launch",                          category: "Social/Apps",          days: 365,  impact: "Transformative", speculative: false, labelKey: null },
  { year: 2006, event: "AWS public cloud launch",                  category: "Cloud/Infrastructure", days: 1095, impact: "Transformative", speculative: false, labelKey: null },
  { year: 2007, event: "iPhone + App Store",                       category: "Mobile",               days: 730,  impact: "Transformative", speculative: false, labelKey: "iPhone" },
  { year: 2008, event: "Android Market / App ecosystem",          category: "Mobile",               days: 365,  impact: "High",          speculative: false, labelKey: null },
  { year: 2010, event: "Instagram launch",                         category: "Social/Apps",          days: 270,  impact: "High",          speculative: false, labelKey: "Instagram" },
  { year: 2012, event: "Hadoop / Big Data in cloud",               category: "Cloud/Infrastructure", days: 730,  impact: "Medium",        speculative: false, labelKey: null },
  { year: 2016, event: "TikTok global launch",                     category: "Social/Apps",          days: 180,  impact: "High",          speculative: false, labelKey: "TikTok" },
  { year: 2022, event: "ChatGPT public launch",                    category: "AI/Agentic",           days: 60,   impact: "Transformative", speculative: false, labelKey: "ChatGPT" },
  { year: 2023, event: "Grok (xAI) public on X",                  category: "AI/Agentic",           days: 180,  impact: "High",          speculative: false, labelKey: null },
  { year: 2024, event: "o1 / Claude 3.5 / Gemini 1.5",           category: "AI/Agentic",           days: 90,   impact: "High",          speculative: false, labelKey: null },
  { year: 2025, event: "Agentic AI tools (Devin-like)",           category: "AI/Agentic",           days: 21,   impact: "Transformative", speculative: false, labelKey: null },
  { year: 2026, event: "GPT-5.4 (OpenAI) public release",        category: "AI/Agentic",           days: 21,   impact: "Transformative", speculative: false, labelKey: null,         dx: -0.28 },
  { year: 2026, event: "Claude Opus 4.7 (Anthropic)",            category: "AI/Agentic",           days: 21,   impact: "High",          speculative: false, labelKey: null,         dx: 0.15 },
  { year: 2026, event: "Gemini 3.1 Pro public preview",          category: "AI/Agentic",           days: 30,   impact: "High",          speculative: false, labelKey: null,         dx: 0.0 },
  { year: 2026, event: "Projected omni-modal / recursive agents", category: "AI/Agentic",          days: 14,   impact: "Transformative", speculative: true,  labelKey: "Projected agents" },
];

const impactR = { "Transformative": 9, "High": 7, "Medium": 5 };

function formatDays(d) {
  if (d <= 30)  return d + " days";
  if (d <= 75)  return "~2 months";
  if (d <= 120) return "~3 months";
  if (d <= 210) return "~6 months";
  if (d <= 320) return "~9 months";
  if (d < 400)  return "~1 year";
  if (d < 600)  return "~2 years";
  if (d < 900)  return "~2–3 years";
  if (d < 1300) return "~3 years";
  if (d < 1600) return "~4 years";
  if (d < 2200) return "~5 years";
  return "~" + Math.round(d / 365) + " years";
}

const margin = { top: 36, right: 64, bottom: 60, left: 80 };
const width  = Math.min(1060, window.innerWidth - 40) - margin.left - margin.right;
const height = 540;

const svg = d3.select("#chart-container")
  .insert("svg", ":first-child")
  .attr("width",  width  + margin.left + margin.right)
  .attr("height", height + margin.top  + margin.bottom)
  .append("g")
  .attr("transform", `translate(${margin.left},${margin.top})`);

const xScale = d3.scaleLinear()
  .domain([1953, 2032])
  .range([0, width]);

const yScale = d3.scaleLog()
  .domain([7, 5000])
  .range([height, 0]);

// Era bands
const eras = [
  { start: 1953, end: 1990, label: "Pre-Internet" },
  { start: 1990, end: 2005, label: "Web Era" },
  { start: 2005, end: 2015, label: "Mobile Era" },
  { start: 2015, end: 2032, label: "AI Era" },
];
eras.forEach(e => {
  svg.append("rect")
    .attr("x", xScale(e.start))
    .attr("y", 0)
    .attr("width", xScale(e.end) - xScale(e.start))
    .attr("height", height)
    .attr("fill", "#161822")
    .attr("opacity", 0.55);
  svg.append("text")
    .attr("x", (xScale(e.start) + xScale(e.end)) / 2)
    .attr("y", 14)
    .attr("text-anchor", "middle")
    .attr("class", "era-label")
    .text(e.label);
});

// Grid lines
const yTicks = [7, 30, 90, 365, 1095, 3650];
svg.append("g").attr("class", "grid")
  .call(d3.axisLeft(yScale).tickValues(yTicks).tickSize(-width).tickFormat(""));

// Trend line: days = 3650 * exp(-0.085 * (year - 1957))
const trendYears = d3.range(1957, 2032.1, 0.5);
const trendFiltered = trendYears.filter(y => {
  const v = 3650 * Math.exp(-0.085 * (y - 1957));
  return v >= 7 && v <= 5000;
});
const trendLine = d3.line()
  .x(y => xScale(y))
  .y(y => yScale(3650 * Math.exp(-0.085 * (y - 1957))))
  .curve(d3.curveCatmullRom);
svg.append("path")
  .datum(trendFiltered)
  .attr("class", "trend-line")
  .attr("d", trendLine);

// X axis
svg.append("g")
  .attr("class", "axis")
  .attr("transform", `translate(0,${height})`)
  .call(d3.axisBottom(xScale)
    .ticks(10)
    .tickFormat(d => d));

// Y axis
const yTickLabels = { 7: "1 wk", 30: "1 mo", 90: "3 mo", 365: "1 yr", 1095: "3 yr", 3650: "10 yr" };
svg.append("g").attr("class", "axis")
  .call(d3.axisLeft(yScale)
    .tickValues(yTicks)
    .tickFormat(d => yTickLabels[d] || d));

// Axis labels
svg.append("text")
  .attr("class", "axis-label")
  .attr("text-anchor", "middle")
  .attr("x", width / 2)
  .attr("y", height + 48)
  .text("Year");

svg.append("text")
  .attr("class", "axis-label")
  .attr("text-anchor", "middle")
  .attr("transform", "rotate(-90)")
  .attr("x", -height / 2)
  .attr("y", -62)
  .text("Days to reach 50M users (log scale)");

// "Today" reference line
svg.append("line")
  .attr("x1", xScale(2026)).attr("x2", xScale(2026))
  .attr("y1", 0).attr("y2", height)
  .attr("stroke", "#374151")
  .attr("stroke-dasharray", "5 4")
  .attr("stroke-width", 1.5);
svg.append("text")
  .attr("x", xScale(2026) + 5).attr("y", 26)
  .attr("fill", "#4b5563").attr("font-size", "10px")
  .text("Today");
svg.append("text")
  .attr("x", xScale(2026) + 5).attr("y", 39)
  .attr("fill", "#4b5563").attr("font-size", "10px")
  .text("Apr 2026");

// Arrow marker
svg.append("defs").append("marker")
  .attr("id", "arrowhead")
  .attr("viewBox", "0 0 10 10")
  .attr("refX", 9).attr("refY", 5)
  .attr("markerWidth", 6).attr("markerHeight", 6)
  .attr("orient", "auto")
  .append("path")
  .attr("d", "M 0 1 L 9 5 L 0 9 z")
  .attr("fill", "#a78bfa").attr("opacity", 0.6);

// Tooltip
const tooltip = d3.select("#tooltip");

function showTip(event, d) {
  const color = catColors[d.category] || "#9ca3af";
  tooltip.style("opacity", 1)
    .html(`
      <strong style="color:${color}">${d.event}</strong>
      <div class="days-value" style="color:${color}">${formatDays(d.days)}</div>
      <div class="meta">
        <b>Category:</b> ${d.category}<br>
        <b>Year:</b> ${d.year}<br>
        <b>Impact:</b> ${d.impact}
      </div>
      ${d.speculative ? '<div class="spec-badge">speculative / projected</div>' : ""}
    `);
}
function moveTip(event) {
  const [mx, my] = d3.pointer(event, document.body);
  const left = mx + 16 + 260 > window.innerWidth ? mx - 276 : mx + 16;
  tooltip.style("left", left + "px").style("top", (my - 10) + "px");
}
function hideTip() { tooltip.style("opacity", 0); }

// Label offset map: [x-offset from dot, y-offset from dot]
const labelOffsets = {
  "ARPANET":          [8, -14],
  "WWW":              [8, -14],
  "iPhone":           [8, -14],
  "Instagram":        [8, -14],
  "TikTok":           [8, 4],
  "ChatGPT":          [-10, -14],
  "Projected agents": [10, 5],
};

// Render dots and labels
data.forEach(d => {
  const displayYear = d.year + (d.dx || 0);
  const x = xScale(displayYear);
  const y = yScale(d.days);
  const color = catColors[d.category] || "#9ca3af";
  const r = impactR[d.impact] || 7;

  if (d.speculative) {
    svg.append("circle")
      .attr("cx", x).attr("cy", y).attr("r", r + 5)
      .attr("fill", "none")
      .attr("stroke", color).attr("stroke-width", 1)
      .attr("opacity", 0.2).attr("stroke-dasharray", "3 2")
      .attr("pointer-events", "none");
    svg.append("circle")
      .datum(d)
      .attr("cx", x).attr("cy", y).attr("r", r)
      .attr("class", "dot-speculative")
      .attr("stroke", color).attr("fill", color)
      .on("mouseover", showTip).on("mousemove", moveTip).on("mouseout", hideTip);
  } else {
    svg.append("circle")
      .datum(d)
      .attr("cx", x).attr("cy", y).attr("r", r)
      .attr("class", "dot")
      .attr("fill", color).attr("opacity", 0.85)
      .on("mouseover", showTip).on("mousemove", moveTip).on("mouseout", hideTip);
  }

  if (d.labelKey) {
    const [ldx, ldy] = labelOffsets[d.labelKey] || [8, 4];
    svg.append("text")
      .attr("class", d.speculative ? "label-speculative" : "label")
      .attr("x", x + ldx).attr("y", y + ldy)
      .attr("text-anchor", ldx < 0 ? "end" : "start")
      .text(d.labelKey);
  }
});

// Annotation arrow from ChatGPT
const cgx = xScale(2022);
const cgy = yScale(60);
const annEndX = cgx - 85;
const annEndY = cgy - 52;

svg.append("path")
  .attr("d", `M ${cgx - 11} ${cgy - 9} C ${cgx - 40} ${cgy - 32} ${annEndX + 50} ${annEndY + 22} ${annEndX + 8} ${annEndY + 8}`)
  .attr("fill", "none")
  .attr("stroke", "#a78bfa").attr("stroke-width", 1.2)
  .attr("opacity", 0.55)
  .attr("marker-end", "url(#arrowhead)");

svg.append("text")
  .attr("x", annEndX).attr("y", annEndY)
  .attr("text-anchor", "end").attr("fill", "#a78bfa")
  .attr("font-size", "11px").attr("opacity", 0.75)
  .text("60× compression");
svg.append("text")
  .attr("x", annEndX).attr("y", annEndY + 14)
  .attr("text-anchor", "end").attr("fill", "#a78bfa")
  .attr("font-size", "11px").attr("opacity", 0.75)
  .text("since ARPANET");

// Legend
d3.select("#legend").selectAll(".legend-item")
  .data(Object.keys(catColors))
  .join("div")
  .attr("class", "legend-item")
  .each(function(cat) {
    d3.select(this).append("div").attr("class", "legend-dot").style("background", catColors[cat]);
    d3.select(this).append("span").text(cat);
  });
</script>
</body>
</html>
