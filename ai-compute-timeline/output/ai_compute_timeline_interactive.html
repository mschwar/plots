// ------------------------------------------------------------------
// FLOPs parser (mirrors src/ai_compute_timeline.py parse_flops)
// ------------------------------------------------------------------
function parseFlops(raw) {
  if (!raw || raw === 'N/A') return null;
  const v = String(raw).trim();

  if (/Speculative/i.test(v)) {
    const m = v.match(/(\d+\.?\d*)e(\d+)/i);
    if (m) return parseFloat(`${m[1]}e${m[2]}`);
    return 1e27;
  }
  if (/High compute/i.test(v) || v === 'Speculative') return 1e21;

  if (/Proxy/i.test(v)) {
    const m = v.match(/(\d+\.?\d*)e(\d+)/i);
    if (m) return parseFloat(`${m[1]}e${m[2]}`);
    if (/low/i.test(v)) return 1e6;
    return 1e3;
  }

  const rangeMatch = v.match(/(\d+\.?\d*)e(\d+)[-–](\d+\.?\d*)e(\d+)/i);
  if (rangeMatch) {
    const lo = parseFloat(`${rangeMatch[1]}e${rangeMatch[2]}`);
    const hi = parseFloat(`${rangeMatch[3]}e${rangeMatch[4]}`);
    return Math.sqrt(lo * hi);
  }

  if (v.startsWith('>')) {
    const m = v.match(/(\d+\.?\d*)e(\d+)/i);
    if (m) return parseFloat(`${m[1]}e${m[2]}`);
  }

  if (/few/i.test(v)) {
    const m = v.match(/e(\d+)/i);
    if (m) return 3 * Math.pow(10, parseInt(m[1]));
  }

  const sci = v.match(/^~?(\d+\.?\d*)[eE]\+?(\d+)/);
  if (sci) return parseFloat(`${sci[1]}e${sci[2]}`);

  const tail = v.match(/~?(\d+\.?\d*)e(\d+)\+?/i);
  if (tail) return parseFloat(`${tail[1]}e${tail[2]}`);

  return null;
}

function proxyByYear(year) {
  if (year < 1945) return 1e2;
  if (year < 1960) return 1e4;
  if (year < 1980) return 1e6;
  if (year < 2000) return 1e8;
  if (year < 2010) return 1e10;
  return 1e12;
}

const data = rawData.map(([year, event, category, flopsRaw, params, impact]) => {
  const primaryCategory = category.split(';')[0].trim();
  let flops = parseFlops(flopsRaw);
  const isProxy = flops === null || /Proxy/i.test(flopsRaw);
  if (flops === null) flops = proxyByYear(year);
  const isSpeculative = /Speculative/i.test(impact) || /Speculative/i.test(flopsRaw);
  return { year, event, category, primaryCategory, flopsRaw, flops, params, impact, isProxy, isSpeculative };
}).sort((a, b) => a.year - b.year);

function supFormat(v) {
  const e = Math.round(Math.log10(v));
  return { base: "10", sup: e.toString() };
}

const yAxisG = svg.append("g").attr("class", "axis");

function renderYAxis() {
  yAxisG.call(d3.axisLeft(yScale).tickValues(yTickVals).tickFormat(""));
  yAxisG.selectAll(".tick").each(function(d) {
    const sel = d3.select(this);
    sel.selectAll("text").remove();
    const { base, sup } = supFormat(d);

      .attr("x", -8)
      .attr("y", 0)
      .attr("dy", "0.32em")

    t.append("tspan").text(base);
    t.append("tspan").attr("baseline-shift", "super").attr("font-size", "9px").text(sup);
  });
}

function renderXAxis(scale) {

  mooreLine
    .attr("x1", xScaleZ(1965))
    .attr("y1", yScale(1e6))
    .attr("x2", xScaleZ(2005))
    .attr("y2", yScale(1e14));
  mooreLabel
    .attr("x", xScaleZ(1985))
    .attr("y", yScale(1e10) - 8);
}

// ------------------------------------------------------------------
// Connecting lines
// ------------------------------------------------------------------
const pre  = data.filter(d => d.year <  2010);
const post = data.filter(d => d.year >= 2010);

const lineG = svg.append("g").attr("clip-path", "url(#plot-clip)").style("pointer-events", "none");
const linePre = lineG.append("path")
  .datum(pre)
  .attr("fill", "none")
  .attr("stroke", "#4b5563")
  .attr("stroke-width", 1)
  .attr("stroke-dasharray", "4 4")
  .attr("opacity", 0.25);
const linePost = lineG.append("path")
  .datum(post)
  .attr("fill", "none")
  .attr("stroke", "#6b7280")
  .attr("stroke-width", 1.2)
  .attr("opacity", 0.5);

function positionLines() {
  const lineGen = d3.line()
    .x(d => xScaleZ(d.year))
    .y(d => yScale(d.flops));
  linePre.attr("d", lineGen);
  linePost.attr("d", lineGen);
}

// ------------------------------------------------------------------
// Bracket + note (must be behind dots)
// ------------------------------------------------------------------
const bracketG = svg.append("g").attr("clip-path", "url(#plot-clip)");
const bracketPath = bracketG.append("path").attr("class", "bracket");
const bracketLabel = svg.append("text")
  .attr("class", "bracket-label")
  .attr("text-anchor", "start")
  .text("2023–25 Frontier Cluster");

function positionBracket() {
  const x = xScaleZ(2026.6);
  const y1 = yScale(1e24);
  const y2 = yScale(5e26);
  bracketPath.attr("d", `M${x - 6},${y1} L${x},${y1} L${x},${y2} L${x - 6},${y2}`);
  bracketLabel
    .attr("x", x + 4)
    .attr("y", (y1 + y2) / 2 + 4);
}

// ------------------------------------------------------------------
// Dots
// ------------------------------------------------------------------
const dotG = svg.append("g").attr("clip-path", "url(#plot-clip)");
const tooltip = d3.select("#tooltip");

const dots = dotG.selectAll("circle").data(data).join("circle")
  .attr("class", d => `dot${d.isProxy ? " proxy" : ""}${d.isSpeculative ? " speculative" : ""}`)
  .attr("r", d => impactRadius(d.impact) * (d.isProxy ? 0.75 : 1))
  .attr("fill", d => catColors[d.primaryCategory] || '#3498DB')
  .attr("stroke", d => d.isSpeculative ? "#f3f4f6" : "#0f1117")
  .attr("stroke-width", d => d.isSpeculative ? 1.5 : 1)
  .attr("opacity", d => d.isProxy ? 0.55 : 0.95)
  .on("mouseover", (event, d) => {
    const color = catColors[d.primaryCategory] || '#3498DB';
    const exp = Math.log10(d.flops).toFixed(1);
    const paramsLine = (d.params && d.params !== 'N/A') ? `<br><b>Params:</b> ${d.params}` : '';
    tooltip.style("opacity", 1)
      .html(`
        <strong style="color:${color}">${d.event}</strong>
        <div class="flops" style="color:${color}">~10<sup>${exp}</sup> FLOPs</div>
        <div class="meta">
          <b>Year:</b> ${d.year}<br>
          <b>Category:</b> ${d.primaryCategory}<br>
          <b>Impact:</b> ${d.impact}${paramsLine}<br>
          <b>Raw:</b> ${d.flopsRaw}
        </div>
        ${d.isProxy ? '<span class="badge proxy">proxy</span>' : ''}
        ${d.isSpeculative ? '<span class="badge spec">speculative</span>' : ''}
      `);
  })
  .on("mousemove", (event) => {
    const [mx, my] = d3.pointer(event, document.body);
    tooltip.style("left", (mx + 16) + "px").style("top", (my - 10) + "px");
  })
  .on("mouseout", () => tooltip.style("opacity", 0));

function positionDots() {
  dots
    .attr("cx", d => xScaleZ(d.year))
    .attr("cy", d => yScale(d.flops));
}

// ------------------------------------------------------------------
// Labels with Y-repulsion
// ------------------------------------------------------------------
const labeled = data
  .map(d => ({ d, text: shortLabel(d.event) }))
  .filter(o => o.text);

const labelG = svg.append("g").attr("clip-path", "url(#plot-clip)");
const leaders = labelG.selectAll("line").data(labeled).join("line")
  .attr("class", "label-leader");

const labels = labelG.selectAll("text").data(labeled).join("text")
  .attr("class", o => `label${/Transformative/i.test(o.d.impact) ? " transformative" : ""}`)
  .text(o => o.text);

function positionLabels() {
  labeled.forEach((o, i) => {
    o.baseX = xScaleZ(o.d.year);
    o.baseY = yScale(o.d.flops);
    const up = (i % 2 === 0);
    o.x = o.baseX + 9;
    o.y = o.baseY + (up ? -8 : 14);
    o.anchor = "start";
    if (o.d.year >= 2020) {
      const k = o.d.year - 2020;
      o.y = o.baseY - 14 - (k * 3) + ((i % 3) * 10);
    }
  });

  labels.each(function(o) {
    try { o.w = this.getComputedTextLength(); }
    catch (e) { o.w = o.text.length * 6; }
    o.h = 12;
  });

  for (let iter = 0; iter < 30; iter++) {
    for (let i = 0; i < labeled.length; i++) {
      for (let j = i + 1; j < labeled.length; j++) {
        const a = labeled[i], b = labeled[j];
        const dx = Math.abs(a.x - b.x);
        const xOverlap = dx < (a.w + b.w) / 2 + 4;
        if (!xOverlap) continue;
        const dy = b.y - a.y;
        if (Math.abs(dy) >= 12) continue;
        const push = (12 - Math.abs(dy)) / 2 + 0.5;
        if (dy >= 0) { a.y -= push; b.y += push; }
        else         { a.y += push; b.y -= push; }
      }
    }
  }

  labels
    .attr("x", o => o.x)
    .attr("y", o => o.y)
    .attr("text-anchor", o => o.anchor);

  leaders
    .attr("x1", o => o.baseX)
    .attr("y1", o => o.baseY)
    .attr("x2", o => o.x)
    .attr("y2", o => o.y - 3)
    .attr("opacity", o => (Math.hypot(o.x - o.baseX, o.y - 3 - o.baseY) > 14) ? 0.5 : 0);
}

// ------------------------------------------------------------------
// Note box
// ------------------------------------------------------------------
const noteG = svg.append("g");
noteG.append("rect")
  .attr("class", "note-box")
  .attr("x", 8)
  .attr("y", height - 54)
  .attr("width", 380)
  .attr("height", 44)
  .attr("rx", 6);
const noteText = noteG.append("text")
  .attr("class", "note-text")
  .attr("x", 16)
  .attr("y", height - 36);
noteText.append("tspan").attr("x", 16).attr("dy", 0)
  .text("Pre-2010 values are rough proxies. Dashed line = proxy era.");
noteText.append("tspan").attr("x", 16).attr("dy", 14)
  .text("Dashed-outline dots = speculative. Size encodes impact.");

// ------------------------------------------------------------------
// Zoom / pan
// ------------------------------------------------------------------
const zoom = d3.zoom()
  .scaleExtent([1, 20])
  .translateExtent([[0, 0], [width, height]])
  .extent([[0, 0], [width, height]])
  .on("zoom", (event) => {
    xScaleZ = event.transform.rescaleX(xScale);
    renderXAxis(xScaleZ);
    positionEras();
    positionMoore();
    positionLines();
    positionBracket();
    positionDots();
    positionLabels();
    applyFilters();
  });

// Insert zoom-catcher as the first child of the plot group so dots/labels
// (appended later) sit on top and still receive mouse events.
const zoomRect = svg.insert("rect", ":first-child")
  .attr("x", 0)
  .attr("y", 0)
  .attr("width", width)
  .attr("height", height)
  .attr("fill", "transparent")
  .style("cursor", "grab")
  .call(zoom);

d3.select("#reset").on("click", () => {
  zoomRect.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
});

// ------------------------------------------------------------------
// Filters
// ------------------------------------------------------------------
let searchTerm = "";
let yearCutoff = 2028;

function applyFilters() {
  const term = searchTerm.toLowerCase();
  dots.attr("opacity", d => {
    if (d.year > yearCutoff) return 0.08;
    if (term && !d.event.toLowerCase().includes(term)) return 0.15;
    return d.isProxy ? 0.55 : 0.95;
  });
  labels.attr("opacity", o => {
    if (o.d.year > yearCutoff) return 0.1;
    if (term && !o.d.event.toLowerCase().includes(term)) return 0.2;
    return 1;
  });
}

d3.select("#search").on("input", function() {
  searchTerm = this.value.trim();
  applyFilters();
});

d3.select("#scrubber").on("input", function() {
  yearCutoff = +this.value;
  d3.select("#scrubber-val").text(yearCutoff);
  applyFilters();
});

// ------------------------------------------------------------------
// Legend
// ------------------------------------------------------------------
const usedCats = [...new Set(data.map(d => d.primaryCategory))]
  .filter(c => catColors[c]);
const muted = new Set();
const legend = d3.select("#legend");
usedCats.forEach(cat => {
  const item = legend.append("div").attr("class", "legend-item").datum(cat);
  item.append("div").attr("class", "legend-dot")
    .style("background", catColors[cat]);
  item.append("span").text(cat);
  item.on("click", function() {
    if (muted.has(cat)) muted.delete(cat); else muted.add(cat);
    d3.select(this).classed("muted", muted.has(cat));
    dots.attr("display", d => muted.has(d.primaryCategory) ? "none" : null);
    labels.attr("display", o => muted.has(o.d.primaryCategory) ? "none" : null);
  });
});

// ------------------------------------------------------------------
// Initial render
// ------------------------------------------------------------------
positionEras();
positionMoore();
positionLines();
positionBracket();
positionDots();
positionLabels();
applyFilters();
</script>
</body>
</html>
